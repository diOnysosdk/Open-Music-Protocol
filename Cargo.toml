[workspace]
members = ["crates/omp-core", "crates/omp-crypto", "crates/omp-manifest", "crates/omp-cli", "crates/omp-identity", "crates/omp-media", "crates/omp-license", "crates/omp-player"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
symphonia = { version = "0.5", default-features = false, features = ["flac", "wav", "pcm"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
unicode-normalization = "0.1"

