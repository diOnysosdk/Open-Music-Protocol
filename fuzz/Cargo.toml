[package]
name = "omp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
omp-core = { path = "../crates/omp-core" }
omp-crypto = { path = "../crates/omp-crypto" }
omp-identity = { path = "../crates/omp-identity" }
omp-media = { path = "../crates/omp-media" }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["flac", "wav", "pcm", "adpcm"] }

[[bin]]
name = "json_v02"
path = "fuzz_targets/json_v02.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonicalization"
path = "fuzz_targets/canonicalization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identity_license"
path = "fuzz_targets/identity_license.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_and_envelope"
path = "fuzz_targets/path_and_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "media_decode"
path = "fuzz_targets/media_decode.rs"
test = false
doc = false
bench = false

