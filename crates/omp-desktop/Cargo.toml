[package]
name = "omp-desktop"
description = "Offline graphical reference player for OMP v0.2"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "omp-desktop"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["glow", "x11", "wayland"] }
omp-core = { path = "../omp-core" }
omp-crypto = { path = "../omp-crypto" }
omp-identity = { path = "../omp-identity" }
omp-license = { path = "../omp-license" }
omp-media = { path = "../omp-media" }
omp-player = { path = "../omp-player" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
