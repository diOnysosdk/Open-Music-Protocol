name: OMP conformance and security gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libsndfile1
      - run: python -m pip install pytest jsonschema rfc8785 cryptography soundfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
      - run: python -m pytest -p no:cacheprovider omp-spec-v0.1/tests omp-spec-v0.2-draft/tests omp-spec-v0.2-amendments/tests
      - shell: pwsh
        run: |
          Get-Content omp-spec-v0.2-draft/SHA256SUMS | ForEach-Object {
            if ($_ -match '^([0-9a-f]{64})\s+(.+)$') {
              if ((Get-FileHash -Algorithm SHA256 -LiteralPath $Matches[2]).Hash.ToLowerInvariant() -ne $Matches[1]) { throw "Frozen artifact changed: $($Matches[2])" }
            }
          }
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with: { token: '${{ secrets.GITHUB_TOKEN }}' }

